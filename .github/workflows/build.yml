name: Build APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
            echo "No signing keystore secret set — release APK will use debug signing."
          else
            mkdir -p keystore
            echo "$KEYSTORE_B64" | base64 -d > keystore/hermes-quick-prompt.jks
            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"
          fi

      - name: Build APKs and run unit tests
        env:
          ANDROID_KEYSTORE_FILE: keystore/hermes-quick-prompt.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest

      - name: Stage APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hermes-quick-prompt-debug.apk
          cp app/build/outputs/apk/release/app-release.apk hermes-quick-prompt-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-quick-prompt-apks
          path: |
            hermes-quick-prompt-debug.apk
            hermes-quick-prompt-release.apk
          if-no-files-found: error

      - name: Publish rolling 'latest' release (main)
        if: ${{ github.ref == 'refs/heads/main' && env.KEYSTORE_PRESENT == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --latest=false \
            --title "Latest build" \
            --notes "Auto-built from \`main\` @ \`${GITHUB_SHA:0:7}\`. Signed release APK installs over previous builds — no uninstall needed." \
            hermes-quick-prompt-release.apk hermes-quick-prompt-debug.apk

      - name: Publish tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_PRESENT == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hermes-quick-prompt-release.apk
            hermes-quick-prompt-debug.apk
          generate_release_notes: true
