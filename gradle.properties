# Project-wide Gradle settings.
# https://developer.android.com/studio/build/gradle-tips

# Increase JVM heap to avoid GC thrashing during DEX generation with Compose BOM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX is required — all Jetpack libraries are AndroidX.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the resources
# declared in the library itself and none from the library's dependencies, thereby reducing the
# size of the R class for that library
android.nonTransitiveRClass=true

# JVM target for Kotlin
kotlin.jvm.target.validation.mode=warning

# Daemon settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
